name: Pages

# Renders the committed datasets (datasets/) and approved case studies
# (case-studies/) with the published agentic-metrics CLI, and deploys the
# report to this repo's GitHub Pages.
on:
  push:
    branches: [master]
    paths:
      - "datasets/**"
      - "case-studies/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npx --yes agentic-metrics@0 report --datasets datasets --case-studies case-studies --out _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
